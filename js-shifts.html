<script>
  function determineServiceType(
    startDateStr,
    endDateStr,
    clockInStr,
    clockOutStr,
  ) {
    if (!startDateStr) return null;

    // Parse YYYY-MM-DD reliably without UTC offset issues
    const [sY, sM, sD] = startDateStr.split("-").map(Number);
    const startObj = new Date(sY, sM - 1, sD);
    const startDay = startObj.getDay(); // 0 = Sunday, 6 = Saturday

    const endStr = endDateStr || startDateStr;
    const [eY, eM, eD] = endStr.split("-").map(Number);
    const endObj = new Date(eY, eM - 1, eD);
    const endDay = endObj.getDay();

    // Check if shift starts on Sunday and extends into Monday
    // Case 1: Start date is Sunday (0) and End date is Monday (1) or later
    // Case 2: Start date is Sunday (0), End date is Sunday (0) or omitted, but clockOut < clockIn (spans past midnight to Monday morning)
    const isSundayStart = startDay === 0;
    const crossesToMonday =
      (endDay === 1 && endObj.getTime() > startObj.getTime()) ||
      (clockInStr &&
        clockOutStr &&
        clockOutStr < clockInStr &&
        endObj.getTime() >= startObj.getTime());

    if (isSundayStart && crossesToMonday) {
      return "Weekday/Weekend";
    }

    // Normal weekend check: Saturday (6) or Sunday (0)
    if (startDay === 0 || startDay === 6) {
      return "Weekend";
    }

    // Otherwise Weekday (Monday 1 to Friday 5)
    return "Weekday";
  }

  function autoSelectServiceType() {
    const startDate = document.querySelector('input[name="startDate"]')?.value;
    const endDate = document.querySelector('input[name="endDate"]')?.value;
    const clockIn = document.getElementById("clockIn")?.value;
    const clockOut = document.getElementById("clockOut")?.value;

    const service = determineServiceType(startDate, endDate, clockIn, clockOut);
    if (service) {
      const serviceSelect = document.querySelector(
        'select[name="serviceType"]',
      );
      if (serviceSelect) {
        serviceSelect.value = service;
      }
    }
  }

  function loadShiftView() {
    // Load Clients
    const clientSelect = document.getElementById("shiftClient");
    clientSelect.innerHTML = '<option value="">Loading...</option>';
    google.script.run
      .withSuccessHandler((data) => {
        let html = '<option value="">Select Client...</option>';
        data
          .filter(
            (item) =>
              item.stage === "Convert Clients" && item.status === "Active",
          )
          .forEach((item) => {
            html += `<option value="${item.id}">${item.name}</option>`;
          });
        clientSelect.innerHTML = html;
        // If we are editing, we might need to set the value after loading
        if (window._pendingShiftEdit) {
          clientSelect.value = window._pendingShiftEdit.clientId;
        }
      })
      .getClientList();

    // Load Caregivers
    const cgSelect = document.getElementById("shiftCaregiver");
    cgSelect.innerHTML = '<option value="">Loading...</option>';
    google.script.run
      .withSuccessHandler((data) => {
        let html = '<option value="">Select Caregiver...</option>';
        data
          .filter((item) => item.status === "Active")
          .forEach((item) => {
            html += `<option value="${item.id}">${item.name}</option>`;
          });
        cgSelect.innerHTML = html;
        if (window._pendingShiftEdit) {
          cgSelect.value = window._pendingShiftEdit.caregiverId;
          delete window._pendingShiftEdit; // Clear after use
        }
      })
      .getCaregiverList();

    // Reset form state slightly
    resetShiftFormState();

    // Start and End dates can be selected for past, present, or future days
  }

  function resetShiftFormState() {
    document.getElementById("shiftForm").reset();
    document.getElementById("shiftId").value = "";
    document.getElementById("btnSaveShift").innerHTML =
      '<i class="ph ph-check-circle text-lg"></i> Save Shift';

    // Use the specific header in this view
    const headerEl = document.querySelector("#view-shifts h2");
    if (headerEl) headerEl.textContent = "Add New Shift";

    // Unlock fields
    document.getElementById("shiftClient").disabled = false;
    document
      .getElementById("shiftClient")
      .classList.remove("bg-gray-100", "cursor-not-allowed");
    document.getElementById("shiftCaregiver").disabled = false;
    document
      .getElementById("shiftCaregiver")
      .classList.remove("bg-gray-100", "cursor-not-allowed");
    document.getElementById("clockIn").readOnly = false;
    document
      .getElementById("clockIn")
      .classList.remove("bg-gray-100", "cursor-not-allowed");
    document.getElementById("clockOut").readOnly = false;
    document
      .getElementById("clockOut")
      .classList.remove("bg-gray-100", "cursor-not-allowed");

    // Remove lock icons from labels
    const clientLabel =
      document.getElementById("shiftClient")?.previousElementSibling;
    const cgLabel =
      document.getElementById("shiftCaregiver")?.previousElementSibling;
    const clockInLabel =
      document.getElementById("clockIn")?.previousElementSibling;
    const clockOutLabel =
      document.getElementById("clockOut")?.previousElementSibling;

    if (clientLabel)
      clientLabel.innerHTML = clientLabel.innerHTML.replace(
        / <i class="ph ph-lock.*"><\/i>/g,
        "",
      );
    if (cgLabel)
      cgLabel.innerHTML = cgLabel.innerHTML.replace(
        / <i class="ph ph-lock.*"><\/i>/g,
        "",
      );
    if (clockInLabel)
      clockInLabel.innerHTML = clockInLabel.innerHTML.replace(
        / <i class="ph ph-lock.*"><\/i>/g,
        "",
      );
    if (clockOutLabel)
      clockOutLabel.innerHTML = clockOutLabel.innerHTML.replace(
        / <i class="ph ph-lock.*"><\/i>/g,
        "",
      );

    // Show repeat options again if hid
    const repeatSection = document
      .querySelector('input[name="repeat"]')
      .closest(".mb-6");
    if (repeatSection) repeatSection.style.display = "block";

    calculateShiftCosts();
  }

  function loadShiftForEdit(shift) {
    // Navigate to view
    appNavigate("shifts");

    // Store for select mapping if data isn't loaded yet
    window._pendingShiftEdit = shift;

    // Populate fields
    document.getElementById("shiftId").value = shift.id;
    document.getElementById("shiftClient").value = shift.clientId;
    document.getElementById("shiftCaregiver").value = shift.caregiverId;
    document.querySelector('input[name="startDate"]').value = shift.date;
    document.querySelector('input[name="endDate"]').value =
      shift.endDate || shift.date;
    document.getElementById("clockIn").value = shift.clockIn;
    document.getElementById("clockOut").value = shift.clockOut;

    document.getElementById("billingType").value = shift.billingType;
    document.querySelector('select[name="serviceType"]').value =
      shift.serviceType;
    document.querySelector('select[name="shiftType"]').value = shift.shiftType;

    document.getElementById("clientRate").value = shift.clientRate;
    document.getElementById("caregiverRate").value = shift.caregiverRate;
    document.querySelector('textarea[name="notes"]').value = shift.notes || "";

    // Update UI state
    document.getElementById("btnSaveShift").innerHTML =
      '<i class="ph ph-check-circle text-lg"></i> Update Shift';
    document.querySelector("#view-shifts h2").textContent =
      "Edit Visit Details";

    // Apply lock icons to labels
    const clientLabel =
      document.querySelector('label[for="shiftClient"]') ||
      document.getElementById("shiftClient").previousElementSibling;
    const cgLabel =
      document.querySelector('label[for="shiftCaregiver"]') ||
      document.getElementById("shiftCaregiver").previousElementSibling;
    const clockInLabel =
      document.querySelector('label[for="clockIn"]') ||
      document.getElementById("clockIn").previousElementSibling;
    const clockOutLabel =
      document.querySelector('label[for="clockOut"]') ||
      document.getElementById("clockOut").previousElementSibling;

    if (clientLabel && !clientLabel.innerHTML.includes("ph-lock"))
      clientLabel.innerHTML += ' <i class="ph ph-lock text-red-500"></i>';
    if (cgLabel && !cgLabel.innerHTML.includes("ph-lock"))
      cgLabel.innerHTML += ' <i class="ph ph-lock text-red-500"></i>';
    if (clockInLabel && !clockInLabel.innerHTML.includes("ph-lock"))
      clockInLabel.innerHTML += ' <i class="ph ph-lock text-red-500"></i>';
    if (clockOutLabel && !clockOutLabel.innerHTML.includes("ph-lock"))
      clockOutLabel.innerHTML += ' <i class="ph ph-lock text-red-500"></i>';

    // Lock fields
    document.getElementById("shiftClient").disabled = true;
    document
      .getElementById("shiftClient")
      .classList.add("bg-gray-100", "cursor-not-allowed");
    document.getElementById("shiftCaregiver").disabled = true;
    document
      .getElementById("shiftCaregiver")
      .classList.add("bg-gray-100", "cursor-not-allowed");
    document.getElementById("clockIn").readOnly = true;
    document
      .getElementById("clockIn")
      .classList.add("bg-gray-100", "cursor-not-allowed");
    document.getElementById("clockOut").readOnly = true;
    document
      .getElementById("clockOut")
      .classList.add("bg-gray-100", "cursor-not-allowed");

    // Hide repeat options for edit mode (simpler MVP)
    const repeatSection = document
      .querySelector('input[name="repeat"]')
      .closest(".mb-6");
    if (repeatSection) repeatSection.style.display = "none";

    // Recalculate derived
    calculateShiftHours();
    calculateShiftCosts();
  }

  function calculateShiftHours() {
    const clockIn = document.getElementById("clockIn").value;
    const clockOut = document.getElementById("clockOut").value;
    const hoursInput = document.getElementById("shiftHours");

    if (clockIn && clockOut) {
      const start = new Date(`1970-01-01T${clockIn}:00`);
      const end = new Date(`1970-01-01T${clockOut}:00`);

      let diff = (end - start) / 1000 / 60 / 60; // hours
      if (diff < 0) diff += 24; // Handle overnight

      hoursInput.value = diff.toFixed(2);
      calculateShiftCosts(); // Recalculate costs when hours change
    }
  }

  function calculateShiftCosts() {
    const billingType = document.getElementById("billingType").value;
    const hours = parseFloat(document.getElementById("shiftHours").value) || 0;
    const clientRate =
      parseFloat(document.getElementById("clientRate").value) || 0;
    const caregiverRate =
      parseFloat(document.getElementById("caregiverRate").value) || 0;

    // Calculate Agency & Softcare Share
    // Logic: (Client Rate - Caregiver Rate) split 80% Agency, 20% Softcare
    const margin = Math.max(0, clientRate - caregiverRate);
    const agency = margin * 0.8;
    const softcare = margin * 0.2;

    document.getElementById("agencyShare").value = agency.toFixed(2);
    document.getElementById("softcareShare").value = softcare.toFixed(2);

    // Calculate Totals
    let totalClient = 0;
    let totalCaregiver = 0;
    let totalAgency = 0;
    let totalSoftcare = 0;

    if (billingType === "Hourly") {
      totalClient = clientRate * hours;
      totalCaregiver = caregiverRate * hours;
      totalAgency = agency * hours;
      totalSoftcare = softcare * hours;
    } else {
      // Fixed Rate
      totalClient = clientRate;
      totalCaregiver = caregiverRate;
      totalAgency = agency;
      totalSoftcare = softcare;
    }

    document.getElementById("totalClientPrice").value =
      "$" + totalClient.toFixed(2);
    document.getElementById("totalCaregiverPrice").value =
      "$" + totalCaregiver.toFixed(2);
    document.getElementById("totalAgencyPrice").value =
      "$" + totalAgency.toFixed(2);
    document.getElementById("totalSoftcarePrice").value =
      "$" + totalSoftcare.toFixed(2);
  }

  function submitShift(
    e,
    confirmedOverlap = false,
    secondCaregiverPolicy = null,
  ) {
    if (e) e.preventDefault();
    const btn = document.getElementById("btnSaveShift");
    const originalText = btn.innerHTML;

    const form = document.getElementById("shiftForm");
    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());

    // If inputs are disabled their values aren't serialized, so we fetch them explicitly
    if (!data.clientId)
      data.clientId = document.getElementById("shiftClient").value;
    if (!data.caregiverId)
      data.caregiverId = document.getElementById("shiftCaregiver").value;

    const isUpdate = !!data.shiftId;
    if (!data.startDate) {
      Swal.fire("Warning", "Start date is required.", "warning");
      return;
    }

    // Add calculated values
    data.secondCaregiverPolicy = secondCaregiverPolicy; // e.g. "Full", "NoCharge", "Custom"
    data.agencyShare = document.getElementById("agencyShare").value;
    data.softcareShare = document.getElementById("softcareShare").value;
    data.totalClientPrice = document
      .getElementById("totalClientPrice")
      .value.replace("$", "");
    data.totalCaregiverPrice = document
      .getElementById("totalCaregiverPrice")
      .value.replace("$", "");
    data.totalAgencyPrice = document
      .getElementById("totalAgencyPrice")
      .value.replace("$", "");
    data.totalSoftcarePrice = document
      .getElementById("totalSoftcarePrice")
      .value.replace("$", "");

    // Phase 2: Overlap Check
    if (!isUpdate && !confirmedOverlap) {
      btn.disabled = true;
      btn.innerHTML =
        '<i class="ph ph-spinner animate-spin"></i> Checking Schedule...';

      google.script.run
        .withSuccessHandler((hasOverlap) => {
          if (hasOverlap) {
            btn.disabled = false;
            btn.innerHTML = originalText;

            Swal.fire({
              title:
                '<div class="text-orange-500"><i class="ph ph-calendar-warning text-4xl"></i><br/>Schedule Conflict</div>',
              html: `
                <div class="text-sm text-gray-600 mb-4">
                  This client already has a shift scheduled at this time. Are you assigning a <b>Second Caregiver</b>?
                  <br><br>Who will be charged for this overlapping shift?
                </div>
                <div class="space-y-3 text-left">
                  <label class="flex items-center p-3 border rounded hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="overlapCharge" value="Full" class="mr-3" checked> 
                    <span><b>Client pays full rate</b><br><small class="text-gray-500">Duplicate charge</small></span>
                  </label>
                  <label class="flex items-center p-3 border rounded hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="overlapCharge" value="NoCharge" class="mr-3"> 
                    <span><b>No Extra Charge to Client</b><br><small class="text-gray-500">Client Rate becomes $0</small></span>
                  </label>
                </div>
              `,
              showCancelButton: true,
              confirmButtonText: "Assign Second Caregiver",
              cancelButtonText: "Cancel Shift",
              confirmButtonColor: "#f97316",
              preConfirm: () => {
                const choice = document.querySelector(
                  'input[name="overlapCharge"]:checked',
                ).value;
                return choice;
              },
            }).then((result) => {
              if (result.isConfirmed) {
                const policy = result.value;
                if (policy === "NoCharge") {
                  document.getElementById("clientRate").value = "0";
                  calculateShiftCosts(); // Updates UI and values
                }
                // Resubmit with override
                submitShift(null, true, policy);
              }
            });
            return;
          } else {
            // No overlap, proceed with save
            proceedWithSave(btn, originalText, isUpdate, data);
          }
        })
        .withFailureHandler((err) => {
          Swal.fire("Error", "Validation failed: " + err.message, "error");
          btn.disabled = false;
          btn.innerHTML = originalText;
        })
        .checkShiftOverlap(
          data.clientId,
          data.startDate,
          data.clockIn,
          data.clockOut,
        );
      return;
    }

    proceedWithSave(btn, originalText, isUpdate, data);
  }

  function proceedWithSave(btn, originalText, isUpdate, data) {
    const handler = isUpdate ? "updateShift" : "saveShift";
    btn.disabled = true;
    btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Saving...';

    google.script.run
      .withSuccessHandler(() => {
        Swal.fire(
          "Success",
          isUpdate
            ? "Shift updated successfully!"
            : "Shift saved to history and sent for admin approval.",
          "success",
        );
        resetShiftFormState();
        btn.disabled = false;
        btn.innerHTML = originalText;
      })
      .withFailureHandler((err) => {
        Swal.fire(
          "Error",
          `Failed to ${isUpdate ? "update" : "save"} shift: ` + err.message,
          "error",
        );
        btn.disabled = false;
        btn.innerHTML = originalText;
      })
      [handler](data);
  }
</script>
