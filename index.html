    <script>
      const DESKTOP_SIDEBAR_KEY = "desktopSidebarCollapsed";

      // Sidebar Toggle Logic for Mobile/Tablet
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebarOverlay");

        if (sidebar.classList.contains("-translate-x-full")) {
          // Open
          sidebar.classList.remove("-translate-x-full");
          overlay.classList.remove("hidden");
        } else {
          // Close
          sidebar.classList.add("-translate-x-full");
          overlay.classList.add("hidden");
        }
      }

      function setDesktopSidebarCollapsed(collapsed) {
        const sidebar = document.getElementById("sidebar");
        const icon = document.getElementById("desktopSidebarToggleIcon");

        if (!sidebar) return;

        sidebar.classList.toggle("sidebar-collapsed", collapsed);
        sidebar.classList.toggle("lg:w-20", collapsed);
        sidebar.classList.toggle("lg:w-64", !collapsed);

        if (icon) {
          icon.classList.toggle("rotate-180", collapsed);
        }
      }

      function toggleDesktopSidebar() {
        if (window.innerWidth < 1024) return;

        const sidebar = document.getElementById("sidebar");
        const isCollapsed = sidebar.classList.contains("sidebar-collapsed");
        const nextState = !isCollapsed;

        setDesktopSidebarCollapsed(nextState);
        localStorage.setItem(DESKTOP_SIDEBAR_KEY, String(nextState));
      }

      // Close sidebar when clicking a nav link on mobile/tablet
      document.addEventListener("DOMContentLoaded", () => {
        if (window.innerWidth >= 1024) {
          const savedState =
            localStorage.getItem(DESKTOP_SIDEBAR_KEY) === "true";
          setDesktopSidebarCollapsed(savedState);
        }

        const navItems = document.querySelectorAll(".sidebar-nav .nav-item");
        navItems.forEach((item) => {
          item.addEventListener("click", () => {
            if (window.innerWidth < 1024) {
              toggleSidebar();
            }
          });
        });

        window.addEventListener("resize", () => {
          if (window.innerWidth >= 1024) {
            const savedState =
              localStorage.getItem(DESKTOP_SIDEBAR_KEY) === "true";
            setDesktopSidebarCollapsed(savedState);
          }
        });
      });
    </script>
