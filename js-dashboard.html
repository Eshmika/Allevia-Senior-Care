<script>
  function loadDashboardStats() {
    google.script.run
      .withSuccessHandler((stats) => {
        if (!stats) return;
        const total = document.getElementById("stat-total");
        const active = document.getElementById("stat-active");
        const inactive = document.getElementById("stat-inactive");
        const stna = document.getElementById("stat-stna");
        if (total) total.textContent = stats.total;
        if (active) active.textContent = stats.active;
        if (inactive) inactive.textContent = stats.inactive;
        if (stna) stna.textContent = stats.stna;
      })
      .getDashboardStats();
  }

  window.onload = function () {
    loadDashboardStats();
  };
</script>
