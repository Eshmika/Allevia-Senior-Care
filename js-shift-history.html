<script>
  const SHIFT_HISTORY_COLUMNS = [
    { key: "errorFlag", label: "Error flag" },
    { key: "shiftId", label: "Shift ID" },
    { key: "invoiceId", label: "Invoice ID" },
    { key: "invoiceStatus", label: "Invoice Status" },
    { key: "clientName", label: "Client ID" },
    { key: "caregiverName", label: "Caregiver ID" },
    { key: "evv", label: "EVV" },
    { key: "scheduledTime", label: "Scheduled Time" },
    { key: "startDate", label: "Start Date" },
    { key: "endDate", label: "End Date" },
    { key: "clockIn", label: "Clock In" },
    { key: "clockOut", label: "Clock Out" },
    { key: "hours", label: "Hours" },
    { key: "inMethod", label: "In Method" },
    { key: "outMethod", label: "Out Method" },
    { key: "billableHours", label: "Billable Hours" },
    { key: "payableHours", label: "Payable Hours" },
    { key: "billingType", label: "Billing Type" },
    { key: "serviceType", label: "Service Type" },
    { key: "shiftType", label: "Shift Type" },
    { key: "authorizationCode", label: "Authorization Code" },
    { key: "clientRate", label: "Client Rate" },
    { key: "caregiverRate", label: "Caregiver Rate" },
    { key: "softcareShare", label: "Softcare Share" },
    { key: "agencyShare", label: "Agency Share" },
    { key: "mileageKm", label: 'Mileage "km"' },
    { key: "mileagePrice", label: "Mileage $" },
    { key: "invoiceTotal", label: "Invoice" },
    { key: "scheduleNote", label: "Schedule Note" },
    { key: "adminNote", label: "Admin Note" },
    { key: "cgShiftStatus", label: "CG Shift Status" },
    { key: "clientShiftStatus", label: "Client Shift Status" },
    { key: "systemShiftStatus", label: "Admin Approval" },
    { key: "systemCheck", label: "System Check" },
    { key: "createdBy", label: "Created By" },
    { key: "createdAt", label: "Created At" },
    { key: "lastModifiedBy", label: "Last Modified By" },
    { key: "lastModifiedAt", label: "Last Modified At" },
  ];

  const shiftHistoryState = {
    payPeriodMode: "Weekly",
    period: null,
    rows: [],
    summary: null,
    loading: false,
  };

  function loadShiftHistoryView() {
    google.script.run
      .withSuccessHandler((settings) => {
        shiftHistoryState.payPeriodMode = settings.payPeriodMode || "Weekly";
        updatePayPeriodToggleUI(shiftHistoryState.payPeriodMode);
        loadShiftHistoryLists();
        refreshShiftHistory();
      })
      .getShiftHistorySettings();
  }

  function updatePayPeriodToggleUI(mode) {
    const weeklyBtn = document.getElementById("modeWeeklyBtn");
    const biweeklyBtn = document.getElementById("modeBiweeklyBtn");
    if (!weeklyBtn || !biweeklyBtn) return;

    const normalizedMode = mode === "Biweekly" ? "Biweekly" : "Weekly";
    const isWeekly = normalizedMode === "Weekly";

    const activeClasses = [
      "bg-white",
      "shadow-sm",
      "text-[#65c027]",
      "font-bold",
    ];
    const inactiveClasses = [
      "text-gray-500",
      "hover:text-gray-800",
      "font-semibold",
    ];

    weeklyBtn.classList.remove(...activeClasses, ...inactiveClasses);
    biweeklyBtn.classList.remove(...activeClasses, ...inactiveClasses);

    if (isWeekly) {
      weeklyBtn.classList.add(...activeClasses);
      biweeklyBtn.classList.add(...inactiveClasses);
    } else {
      biweeklyBtn.classList.add(...activeClasses);
      weeklyBtn.classList.add(...inactiveClasses);
    }
  }

  function setPayPeriodMode(mode) {
    const normalizedMode = mode === "Biweekly" ? "Biweekly" : "Weekly";

    if (shiftHistoryState.payPeriodMode === normalizedMode) {
      updatePayPeriodToggleUI(normalizedMode);
      return;
    }

    shiftHistoryState.payPeriodMode = normalizedMode;
    updatePayPeriodToggleUI(normalizedMode);

    google.script.run
      .withSuccessHandler((res) => {
        shiftHistoryState.payPeriodMode = res?.payPeriodMode || normalizedMode;
        updatePayPeriodToggleUI(shiftHistoryState.payPeriodMode);

        // Reset date filters so server recomputes the selected weekly/biweekly period.
        const startDate = document.getElementById("shiftHistoryStartDate");
        const endDate = document.getElementById("shiftHistoryEndDate");
        if (startDate) startDate.value = "";
        if (endDate) endDate.value = "";

        refreshShiftHistory();
      })
      .withFailureHandler((error) => {
        shiftHistoryState.payPeriodMode =
          normalizedMode === "Weekly" ? "Biweekly" : "Weekly";
        updatePayPeriodToggleUI(shiftHistoryState.payPeriodMode);
        Swal.fire(
          "Error",
          error?.message || "Unable to update pay period mode.",
          "error",
        );
      })
      .saveShiftHistoryPayPeriodSetting(normalizedMode);
  }

  function loadShiftHistoryLists() {
    const caregiverFilter = document.getElementById(
      "shiftHistoryCaregiverFilter",
    );
    const clientFilter = document.getElementById("shiftHistoryClientFilter");

    if (caregiverFilter) {
      caregiverFilter.innerHTML = '<option value="all">All Caregivers</option>';
    }
    if (clientFilter) {
      clientFilter.innerHTML = '<option value="all">All Clients</option>';
    }

    google.script.run
      .withSuccessHandler((caregivers) => {
        if (!caregiverFilter) return;
        const options = (caregivers || [])
          .filter((item) => item && item.id)
          .sort((a, b) =>
            String(a.name || "").localeCompare(String(b.name || "")),
          )
          .map(
            (item) =>
              `<option value="${escapeHtml(item.id)}">${escapeHtml(
                item.name || item.id,
              )}</option>`,
          )
          .join("");

        caregiverFilter.innerHTML =
          '<option value="all">All Caregivers</option>' + options;
      })
      .getCaregiverList();

    google.script.run
      .withSuccessHandler((clients) => {
        if (!clientFilter) return;
        const options = (clients || [])
          .filter((item) => item && item.id)
          .sort((a, b) =>
            String(a.name || "").localeCompare(String(b.name || "")),
          )
          .map(
            (item) =>
              `<option value="${escapeHtml(item.id)}">${escapeHtml(
                item.name || item.id,
              )}</option>`,
          )
          .join("");

        clientFilter.innerHTML =
          '<option value="all">All Clients</option>' + options;
      })
      .getClientList();
  }

  function getShiftHistoryFilters() {
    return {
      startDate: document.getElementById("shiftHistoryStartDate")?.value || "",
      endDate: document.getElementById("shiftHistoryEndDate")?.value || "",
      caregiverId:
        document.getElementById("shiftHistoryCaregiverFilter")?.value || "all",
      clientId:
        document.getElementById("shiftHistoryClientFilter")?.value || "all",
      systemCheck:
        document.getElementById("shiftHistorySystemFilter")?.value || "all",
      search: document.getElementById("shiftHistorySearch")?.value || "",
    };
  }

  function refreshShiftHistory() {
    const filters = getShiftHistoryFilters();
    const thead = document.getElementById("shiftHistoryThead");
    const tbody = document.getElementById("shiftHistoryTbody");
    const emptyState = document.getElementById("shiftHistoryEmptyState");

    if (!thead || !tbody) return;

    shiftHistoryState.loading = true;
    thead.innerHTML = "";
    tbody.innerHTML = `
      <tr>
        <td colspan="${SHIFT_HISTORY_COLUMNS.length}" class="px-6 py-16 text-center text-gray-400">Loading shift history...</td>
      </tr>`;

    google.script.run
      .withSuccessHandler((payload) => {
        if (!payload) {
          throw new Error(
            "Server returned null payload. Check if sheet data contains invalid types like unstringified Date objects.",
          );
        }
        shiftHistoryState.loading = false;
        shiftHistoryState.period = payload.period;
        shiftHistoryState.rows = payload.rows || [];
        shiftHistoryState.summary = payload.summary || {};

        const sDate = document.getElementById("shiftHistoryStartDate");
        const eDate = document.getElementById("shiftHistoryEndDate");
        if (sDate && !sDate.value && payload.period?.start)
          sDate.value = payload.period.start;
        if (eDate && !eDate.value && payload.period?.end)
          eDate.value = payload.period.end;

        renderShiftHistory(payload);
      })
      .withFailureHandler((error) => {
        shiftHistoryState.loading = false;
        tbody.innerHTML = `
          <tr>
            <td colspan="${SHIFT_HISTORY_COLUMNS.length}" class="px-6 py-16 text-center text-red-500">Unable to load shift history: ${error.message}</td>
          </tr>`;
        if (emptyState) emptyState.classList.add("hidden");
      })
      .getShiftHistory(filters);
  }

  function resetShiftHistoryFilters() {
    const caregiverFilter = document.getElementById(
      "shiftHistoryCaregiverFilter",
    );
    const clientFilter = document.getElementById("shiftHistoryClientFilter");
    const systemFilter = document.getElementById("shiftHistorySystemFilter");
    const search = document.getElementById("shiftHistorySearch");
    const startDate = document.getElementById("shiftHistoryStartDate");
    const endDate = document.getElementById("shiftHistoryEndDate");

    if (caregiverFilter) caregiverFilter.value = "all";
    if (clientFilter) clientFilter.value = "all";
    if (systemFilter) systemFilter.value = "all";
    if (search) search.value = "";
    if (startDate) startDate.value = "";
    if (endDate) endDate.value = "";

    refreshShiftHistory();
  }

  function renderShiftHistory(payload) {
    const thead = document.getElementById("shiftHistoryThead");
    const tbody = document.getElementById("shiftHistoryTbody");
    const emptyState = document.getElementById("shiftHistoryEmptyState");
    const periodLabel = document.getElementById("shiftHistoryPeriodLabel");
    const invoiceLabel = document.getElementById("shiftHistoryInvoiceLabel");

    if (!thead || !tbody) return;

    if (periodLabel)
      periodLabel.textContent =
        payload.currentPeriod?.label || payload.period?.label || "--";
    if (invoiceLabel)
      invoiceLabel.textContent = payload.rows?.[0]?.invoiceId || "Auto";

    document.getElementById("summaryTotalClient").textContent = formatCurrency(
      payload.summary?.totalClient || 0,
    );
    document.getElementById("summaryTotalCaregiver").textContent =
      formatCurrency(payload.summary?.totalCaregiver || 0);
    document.getElementById("summaryTotalAgency").textContent = formatCurrency(
      payload.summary?.totalAgency || 0,
    );
    document.getElementById("summaryTotalSoftcare").textContent =
      formatCurrency(payload.summary?.totalSoftcare || 0);
    document.getElementById("summaryTotalMileage").textContent = formatCurrency(
      payload.summary?.totalMileage || 0,
    );
    document.getElementById("summaryTotalHours").textContent = (
      payload.summary?.hours || 0
    ).toFixed(2);

    thead.innerHTML = `
      <tr>${SHIFT_HISTORY_COLUMNS.map(
        (column) =>
          `<th class="px-4 py-4 font-bold whitespace-nowrap">${column.label}</th>`,
      ).join(
        "",
      )}<th class="px-4 py-4 font-bold whitespace-nowrap text-right">Actions</th></tr>
    `;

    if (!payload.rows || payload.rows.length === 0) {
      tbody.innerHTML = "";
      if (emptyState) emptyState.classList.remove("hidden");
      return;
    }

    if (emptyState) emptyState.classList.add("hidden");

    tbody.innerHTML = payload.rows
      .map((row) => {
        const approved =
          String(row.systemShiftStatus || "").toLowerCase() === "approved" ||
          String(row.confirmationIndicator || "").toLowerCase() === "confirmed";
        const approveBtnClass = approved
          ? "bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white"
          : "bg-amber-50 text-amber-700 hover:bg-amber-600 hover:text-white";
        const approveIcon = approved ? "ph-check-circle" : "ph-seal-check";
        const approveLabel = approved ? "Approved" : "Approve";

        return `
          <tr onclick="toggleShiftRowHighlight(this, event)" class="shift-history-row group hover:bg-gray-50/80 transition-colors cursor-pointer">
            ${SHIFT_HISTORY_COLUMNS.map((column) =>
              renderHistoryCell(column.key, row),
            ).join("")}
            <td class="px-4 py-4 whitespace-nowrap text-right">
              <div class="flex items-center justify-end gap-1.5 opacity-90 group-hover:opacity-100 transition-opacity">
                <!-- Edit Action -->
                <button type="button" title="Edit Shift Info" onclick='openShiftHistoryAction("edit", ${JSON.stringify(
                  row,
                ).replace(
                  /'/g,
                  "&#39;",
                )})' class="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white hover:shadow-md transition-all text-xs font-bold uppercase tracking-wider">
                  <i class="ph ph-pencil-simple text-sm"></i>
                  <span class="hidden 2xl:inline">Edit</span>
                </button>

                <button type="button" title="Admin Approve For Invoice" onclick="toggleConfirmation(this, '${
                  row.shiftId
                }', '${
                  approved ? "Confirmed" : "Unconfirmed"
                }')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md ${approveBtnClass} hover:shadow-md transition-all text-xs font-bold uppercase tracking-wider">
                  <i class="ph ${approveIcon} text-sm"></i>
                  <span class="hidden 2xl:inline">${approveLabel}</span>
                </button>

                <div class="h-6 w-px bg-gray-200 mx-0.5"></div>

                <!-- Resend Client -->
                <button type="button" title="Resend Client Confirm" onclick='openShiftHistoryAction("resend_client", ${JSON.stringify(
                  row,
                ).replace(
                  /'/g,
                  "&#39;",
                )})' class="flex items-center justify-center w-8 h-8 rounded-full bg-orange-50 text-orange-600 hover:bg-orange-500 hover:text-white hover:shadow-md transition-all">
                  <i class="ph ph-user text-sm"></i>
                </button>

                <!-- Resend CG -->
                <button type="button" title="Resend Caregiver Confirm" onclick='openShiftHistoryAction("resend_cg", ${JSON.stringify(
                  row,
                ).replace(
                  /'/g,
                  "&#39;",
                )})' class="flex items-center justify-center w-8 h-8 rounded-full bg-purple-50 text-purple-600 hover:bg-purple-500 hover:text-white hover:shadow-md transition-all">
                  <i class="ph ph-stethoscope text-sm"></i>
                </button>

                <div class="h-6 w-px bg-gray-200 mx-0.5"></div>

                <!-- PDF -->
                <button type="button" title="Download PDF" onclick='openShiftHistoryAction("pdf", ${JSON.stringify(
                  row,
                ).replace(
                  /'/g,
                  "&#39;",
                )})' class="flex items-center justify-center w-8 h-8 rounded-full bg-rose-50 text-rose-600 hover:bg-rose-500 hover:text-white hover:shadow-md transition-all">
                  <i class="ph ph-file-pdf text-sm"></i>
                </button>

                <button type="button" title="Delete Shift" onclick='openShiftHistoryAction("delete", ${JSON.stringify(
                  row,
                ).replace(
                  /'/g,
                  "&#39;",
                )})' class="flex items-center justify-center w-8 h-8 rounded-full bg-red-50 text-red-600 hover:bg-red-600 hover:text-white hover:shadow-md transition-all">
                  <i class="ph ph-trash text-sm"></i>
                </button>
              </div>
            </td>
          </tr>`;
      })
      .join("");
  }

  function renderHistoryCell(key, row) {
    const value = row[key] ?? "";
    const base = "px-4 py-4 align-top whitespace-nowrap";

    if (key === "errorFlag") {
      return `<td class="${base}">${renderBadge(
        value || "OK",
        value ? "red" : "green",
      )}</td>`;
    }

    if (key === "invoiceStatus") {
      return `<td class="${base}">${renderInvoiceBadge(value)}</td>`;
    }

    if (key === "systemCheck") {
      const tone =
        value === "OK" ? "green" : value.includes("Missing") ? "red" : "amber";
      return `<td class="${base} whitespace-normal min-w-[180px]">${renderBadge(
        value || "OK",
        tone,
      )}</td>`;
    }

    if (["clientName", "caregiverName"].includes(key)) {
      const parts = value.split(" / ");
      if (parts.length > 1) {
        const name = parts.slice(0, -1).join(" / ");
        const id = parts[parts.length - 1];
        return `<td class="${base} whitespace-normal min-w-[180px] max-w-[260px]">
          <div class="text-sm font-bold text-black">${escapeHtml(name)}</div>
          <div class="text-xs text-gray-400 mt-0.5">${escapeHtml(id)}</div>
        </td>`;
      } else {
        return `<td class="${base} whitespace-normal min-w-[180px] max-w-[260px]"><div class="text-sm font-bold text-black">${escapeHtml(
          value,
        )}</div></td>`;
      }
    }

    if (["scheduleNote", "adminNote"].includes(key)) {
      return `<td class="${base} whitespace-normal min-w-[180px] max-w-[260px]"><div class="text-sm text-gray-700">${escapeHtml(
        value,
      )}</div></td>`;
    }

    if (
      [
        "clientRate",
        "caregiverRate",
        "softcareShare",
        "agencyShare",
        "invoiceTotal",
        "mileagePrice",
      ].includes(key)
    ) {
      return `<td class="${base} font-semibold text-gray-900">${formatCurrency(
        value,
      )}</td>`;
    }

    if (key === "clockIn" || key === "clockOut" || key === "scheduledTime") {
      let displayTime = value;
      if (key === "scheduledTime" && value && value.includes(" - ")) {
        const [start, end] = value.split(" - ");
        displayTime = [start, end]
          .map((t) => {
            const parts = t.split(":");
            const hNum = parseInt(parts[0], 10);
            const ampm = hNum >= 12 ? "PM" : "AM";
            const h12 = hNum % 12 || 12;
            return `${h12}:${parts[1]} ${ampm}`;
          })
          .join(" - ");
      } else if (value && typeof value === "string" && value.includes(":")) {
        const parts = value.split(":");
        const hNum = parseInt(parts[0], 10);
        const ampm = hNum >= 12 ? "PM" : "AM";
        const h12 = hNum % 12 || 12;
        displayTime = `${h12}:${parts[1]} ${ampm}`;
      }
      return `<td class="${base} font-medium text-gray-900">${escapeHtml(
        displayTime,
      )}</td>`;
    }

    if (["hours", "billableHours", "payableHours"].includes(key)) {
      return `<td class="${base} font-semibold text-gray-900">${escapeHtml(
        String(value || "0.00"),
      )}</td>`;
    }

    if (
      ["cgShiftStatus", "clientShiftStatus", "systemShiftStatus"].includes(key)
    ) {
      const vStr = String(value || "").trim();
      const lowerValue = vStr.toLowerCase();
      let badgeHtml = "";

      if (lowerValue === "pending" || lowerValue === "pending approval") {
        badgeHtml = `
          <div class="inline-flex items-center gap-1.5 border-b-[2px] border-yellow-400 pb-0.5 group-hover:-translate-y-0.5 transition-all">
            <i class="ph-fill ph-clock text-yellow-500 text-[13px]"></i>
            <span class="text-yellow-700 font-bold text-[11px] uppercase tracking-wider">${escapeHtml(
              vStr,
            )}</span>
          </div>`;
      } else if (lowerValue === "approved") {
        badgeHtml = `
          <div class="inline-flex items-center gap-1.5 border-b-[2px] border-emerald-400 pb-0.5 group-hover:-translate-y-0.5 transition-all">
            <i class="ph-fill ph-seal-check text-emerald-500 text-[13px]"></i>
            <span class="text-emerald-700 font-bold text-[11px] uppercase tracking-wider">${escapeHtml(
              vStr,
            )}</span>
          </div>`;
      } else if (lowerValue === "confirm" || lowerValue === "confirmed") {
        badgeHtml = `
          <div class="inline-flex items-center gap-1.5 border-b-[2px] border-emerald-400 pb-0.5 group-hover:-translate-y-0.5 transition-all">
            <i class="ph-fill ph-check-circle text-emerald-500 text-[13px]"></i>
            <span class="text-emerald-700 font-bold text-[11px] uppercase tracking-wider">${escapeHtml(
              vStr,
            )}</span>
          </div>`;
      } else if (lowerValue === "decline" || lowerValue === "declined") {
        badgeHtml = `
          <div class="inline-flex items-center gap-1.5 border-b-[2px] border-rose-400 pb-0.5 group-hover:-translate-y-0.5 transition-all">
            <i class="ph-fill ph-x-circle text-rose-500 text-[13px]"></i>
            <span class="text-rose-700 font-bold text-[11px] uppercase tracking-wider">${escapeHtml(
              vStr,
            )}</span>
          </div>`;
      } else {
        badgeHtml = `<span class="text-gray-700">${escapeHtml(vStr)}</span>`;
      }

      return `<td class="${base}">${badgeHtml}</td>`;
    }

    return `<td class="${base} text-gray-700">${escapeHtml(
      String(value || ""),
    )}</td>`;
  }

  function renderBadge(text, tone) {
    const palette = {
      green: "bg-emerald-50 text-emerald-700 border-emerald-200",
      red: "bg-rose-50 text-rose-700 border-rose-200",
      amber: "bg-amber-50 text-amber-700 border-amber-200",
      orange: "bg-orange-50 text-orange-700 border-orange-200",
      gray: "bg-gray-100 text-gray-600 border-gray-200",
    };
    return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-bold border ${
      palette[tone] || palette.gray
    }">${escapeHtml(String(text))}</span>`;
  }

  function renderInvoiceBadge(text) {
    const tone =
      text === "Paid"
        ? "green"
        : text === "Partially"
          ? "amber"
          : text === "Voided"
            ? "gray"
            : "orange";
    return renderBadge(text || "Unpaid", tone);
  }

  function formatCurrency(value) {
    const number = Number(String(value).replace(/[^0-9.-]/g, "")) || 0;
    return new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD",
    }).format(number);
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function openShiftHistoryAction(action, row) {
    if (action === "edit") {
      appNavigate("edit-shift-history");
      if (typeof populateEditShiftHistoryView === "function") {
        populateEditShiftHistoryView(row);
      } else {
        console.warn("populateEditShiftHistoryView is not defined.");
      }
      return;
    }

    if (action === "resend_client") {
      const clientId =
        row.clientId ||
        (row.clientName ? row.clientName.split(" / ")[1] : null);
      if (!clientId) {
        Swal.fire("Error", "No client ID found for this shift.", "error");
        return;
      }

      Swal.fire({
        title: "Resend Client Email?",
        text: "This will resend the approval email to the client.",
        icon: "question",
        showCancelButton: true,
        confirmButtonColor: "#65c027",
        confirmButtonText: "Yes, Resend",
      }).then((result) => {
        if (result.isConfirmed) {
          Swal.fire({
            title: "Sending...",
            text: "Please wait.",
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading(),
          });

          google.script.run
            .withSuccessHandler((res) => {
              Swal.fire(
                "Sent!",
                "Approval email has been resent to the client.",
                "success",
              );
            })
            .withFailureHandler((err) => {
              Swal.fire("Error", err.message, "error");
            })
            .sendClientShiftApprovals([clientId], row.shiftId);
        }
      });
      return;
    }

    if (action === "resend_cg") {
      const caregiverId =
        row.caregiverId ||
        (row.caregiverName ? row.caregiverName.split(" / ")[1] : null);
      if (!caregiverId) {
        Swal.fire("Error", "No caregiver ID found for this shift.", "error");
        return;
      }

      Swal.fire({
        title: "Resend Caregiver Email?",
        text: "This will resend the approval email to the caregiver.",
        icon: "question",
        showCancelButton: true,
        confirmButtonColor: "#65c027",
        confirmButtonText: "Yes, Resend",
      }).then((result) => {
        if (result.isConfirmed) {
          Swal.fire({
            title: "Sending...",
            text: "Please wait.",
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading(),
          });

          google.script.run
            .withSuccessHandler((res) => {
              Swal.fire(
                "Sent!",
                "Approval email has been resent to the caregiver.",
                "success",
              );
            })
            .withFailureHandler((err) => {
              Swal.fire("Error", err.message, "error");
            })
            .sendCaregiverShiftApprovals([caregiverId], row.shiftId);
        }
      });
      return;
    }

    if (action === "pdf") {
      const temp = document.createElement("div");
      temp.className = "p-6 text-sm text-gray-800 bg-white";
      temp.innerHTML = `
        <h1 class="text-xl font-bold mb-3">Shift Summary</h1>
        <div>Shift ID: ${escapeHtml(row.shiftId)}</div>
        <div>Invoice ID: ${escapeHtml(row.invoiceId)}</div>
        <div>Client: ${escapeHtml(row.clientName)}</div>
        <div>Caregiver: ${escapeHtml(row.caregiverName)}</div>
        <div>Period: ${escapeHtml(row.payPeriodStart)} to ${escapeHtml(
          row.payPeriodEnd,
        )}</div>
        <div>Hours: ${escapeHtml(row.hours)}</div>
        <div>Invoice: ${escapeHtml(row.invoiceTotal)}</div>
      `;
      document.body.appendChild(temp);
      html2pdf()
        .from(temp)
        .save(`shift-${row.shiftId}.pdf`)
        .then(() => temp.remove());
      return;
    }

    if (action === "delete") {
      Swal.fire({
        title: "Delete Shift?",
        text: "This will remove the shift from history and it will no longer appear in invoices.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#dc2626",
        confirmButtonText: "Yes, Delete Shift",
      }).then((result) => {
        if (!result.isConfirmed) return;

        Swal.fire({
          title: "Deleting...",
          text: "Please wait.",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        google.script.run
          .withSuccessHandler(() => {
            Swal.fire("Deleted", "Shift removed successfully.", "success");
            refreshShiftHistory();
            if (typeof refreshInvoiceView === "function") {
              refreshInvoiceView();
            }
          })
          .withFailureHandler((err) => {
            Swal.fire(
              "Error",
              err.message || "Unable to delete shift.",
              "error",
            );
          })
          .deleteShift(row.shiftId);
      });
      return;
    }
  }

  function sendShiftHistoryEmails(type) {
    if (!shiftHistoryState.rows || shiftHistoryState.rows.length === 0) {
      Swal.fire("No Data", "There are no shifts displayed to email.", "info");
      return;
    }

    let ids = [];
    if (type === "caregiver") {
      const caregiverList = shiftHistoryState.rows
        .map(
          (r) =>
            r.caregiverId ||
            (r.caregiverName ? r.caregiverName.split(" / ")[1] : null),
        )
        .filter(Boolean);
      ids = [...new Set(caregiverList)];
    } else if (type === "client") {
      const clientList = shiftHistoryState.rows
        .map(
          (r) =>
            r.clientId || (r.clientName ? r.clientName.split(" / ")[1] : null),
        )
        .filter(Boolean);
      ids = [...new Set(clientList)];
    }

    if (ids.length === 0) {
      Swal.fire(
        "No Data",
        `No valid ${type}s found in the current view.`,
        "info",
      );
      return;
    }

    const properType = type === "caregiver" ? "Caregivers" : "Clients";

    Swal.fire({
      title: `Send ${properType} Emails?`,
      text: `This will send an email to ${ids.length} unique ${type}(s) currently shown in the list.`,
      icon: "question",
      showCancelButton: true,
      confirmButtonText: "Yes, Send Emails",
      cancelButtonText: "Cancel",
      confirmButtonColor: "#65c027",
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire({
          title: "Sending...",
          text: "Please wait while the emails are being sent.",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });

        const serverFunc =
          type === "caregiver"
            ? "sendCaregiverShiftApprovals"
            : "sendClientShiftApprovals";

        const currentInvoiceId = shiftHistoryState.rows.length
          ? shiftHistoryState.rows[0].invoiceId
          : null;

        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success) {
              Swal.fire("Sent!", res.message, "success");
            } else {
              Swal.fire(
                "Error",
                res?.message || "Failed to send emails.",
                "error",
              );
            }
          })
          .withFailureHandler((err) => {
            Swal.fire("Error", err.message, "error");
          })
          [serverFunc](ids, currentInvoiceId);
      }
    });
  }

  function toggleConfirmation(buttonEl, shiftId, currentStatus) {
    const isConfirmed = currentStatus === "Confirmed";
    const newStatus = isConfirmed ? "Unconfirmed" : "Confirmed";
    const row = shiftHistoryState.rows.find((r) => r.shiftId === shiftId);

    const promptTitle = isConfirmed
      ? "Revoke Admin Approval?"
      : "Approve Shift For Invoice?";
    const promptText = isConfirmed
      ? "This will remove the shift from the invoice page until it is approved again."
      : "This shift will appear on the invoice page after approval.";
    const confirmBtnText = isConfirmed ? "Yes, Revoke" : "Yes, Approve";
    const confirmBtnColor = isConfirmed ? "#d33" : "#16a34a";

    Swal.fire({
      title: promptTitle,
      text: promptText,
      icon: "question",
      showCancelButton: true,
      confirmButtonColor: confirmBtnColor,
      confirmButtonText: confirmBtnText,
    }).then((result) => {
      if (result.isConfirmed) {
        // Set loading state on button
        const iconEl = buttonEl.querySelector("i");
        const originalClass = iconEl.className;
        iconEl.className = "ph ph-spinner animate-spin text-sm";
        buttonEl.disabled = true;

        google.script.run
          .withSuccessHandler((res) => {
            buttonEl.disabled = false;
            if (res && res.success) {
              const isNowConfirmed = res.newStatus === "Confirmed";

              // Send emails if confirming
              if (isNowConfirmed && row) {
                const caregiverId =
                  row.caregiverId ||
                  (row.caregiverName
                    ? row.caregiverName.split(" / ")[1]
                    : null);
                const clientId =
                  row.clientId ||
                  (row.clientName ? row.clientName.split(" / ")[1] : null);

                if (caregiverId) {
                  google.script.run.sendCaregiverShiftApprovals(
                    [caregiverId],
                    row.shiftId,
                  );
                }
                if (clientId) {
                  google.script.run.sendClientShiftApprovals(
                    [clientId],
                    row.shiftId,
                  );
                }

                Swal.fire({
                  toast: true,
                  position: "top-end",
                  showConfirmButton: false,
                  timer: 3000,
                  icon: "success",
                  title: "Approved & emails sent!",
                });
              } else if (!isNowConfirmed) {
                Swal.fire({
                  toast: true,
                  position: "top-end",
                  showConfirmButton: false,
                  timer: 3000,
                  icon: "info",
                  title: "Approval revoked",
                });
              }

              // Update the DOM to reflect new state
              const updatedIconClass = isNowConfirmed
                ? "ph-check-circle"
                : "ph-seal-check";
              const updatedBtnClass = isNowConfirmed
                ? "bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white"
                : "bg-amber-50 text-amber-700 hover:bg-amber-600 hover:text-white";
              const confirmLabel = isNowConfirmed ? "Approved" : "Approve";

              iconEl.className = `ph ${updatedIconClass} text-sm`;
              buttonEl.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-md ${updatedBtnClass} hover:shadow-md transition-all text-xs font-bold uppercase tracking-wider`;

              const spanEl = buttonEl.querySelector("span");
              if (spanEl) {
                spanEl.textContent = confirmLabel;
              }

              // Update the onclick handler to pass the new status
              buttonEl.setAttribute(
                "onclick",
                `toggleConfirmation(this, '${shiftId}', '${res.newStatus}')`,
              );

              // Update local state
              if (row) {
                row.confirmationIndicator = res.newStatus;
                row.systemShiftStatus =
                  res.newSystemStatus || row.systemShiftStatus;
              }

              if (typeof refreshInvoiceView === "function") {
                refreshInvoiceView();
              }
            } else {
              iconEl.className = originalClass;
              Swal.fire(
                "Error",
                res?.message || "Failed to update confirmation status.",
                "error",
              );
            }
          })
          .withFailureHandler((err) => {
            buttonEl.disabled = false;
            iconEl.className = originalClass;
            Swal.fire("Error", err.message, "error");
          })
          .toggleShiftConfirmation(shiftId, currentStatus);
      }
    });
  }

  window._currentEditRow = null;

  function populateEditShiftHistoryView(row) {
    if (!row) return;
    window._currentEditRow = row;

    console.log("Populating edit view with:", row);

    // Core (Locked) Information
    document.getElementById("evShiftId").value = row.shiftId || "";
    document.getElementById("evClientName").value = row.clientName || "";
    document.getElementById("evCaregiverName").value = row.caregiverName || "";
    document.getElementById("evStartDate").value = row.startDate || "";
    document.getElementById("evEndDate").value = row.endDate || "";

    // EVV (Clock-In/Clock-Out) Note: these are the actual system records
    document.getElementById("evClockIn").value = row.clockIn || "";
    document.getElementById("evClockOut").value = row.clockOut || "";

    // Schedule Limits - typically coming from a schedule system, fallback to EVV times if missing
    document.getElementById("evSchedIn").value =
      row.schedIn || row.clockIn || "";
    document.getElementById("evSchedOut").value =
      row.schedOut || row.clockOut || "";

    // Initialize Hours (Editable defaults based on Sched / EVV)
    // Payable & Billable default to calculated scheduled snap
    const defaultHours = computeDefaultHoursAndTimes(row);

    document.getElementById("evPayableIn").value =
      row.payableTimeIn || defaultHours.payableIn;
    document.getElementById("evPayableOut").value =
      row.payableTimeOut || defaultHours.payableOut;
    document.getElementById("evBillableIn").value =
      row.billableTimeIn || defaultHours.billableIn;
    document.getElementById("evBillableOut").value =
      row.billableTimeOut || defaultHours.billableOut;

    // Billing Types
    document.getElementById("evBillingType").value =
      row.billingType || "Hourly";
    document.getElementById("evService").value = row.serviceType || "Weekday";
    document.getElementById("evType").value = row.shiftType || "REG";

    // Rates
    document.getElementById("evClientRate").value = row.clientRate || "";
    document.getElementById("evCaregiverRate").value = row.caregiverRate || "";
    document.getElementById("evBonusRate").value = row.bonusRate || "";

    // Reasons/Notes
    document.getElementById("evScheduleReason").value =
      row.scheduleReason || "";
    document.getElementById("evAdminNote").value = row.adminNote || "";

    // Calculate all dependent totals/hours logic
    calculateVisitHours();
  }

  function computeDefaultHoursAndTimes(row) {
    // Rules:
    // - If EVV In is within +/- 10 mins of Sched In, snap to Sched In for Payable.
    // - Same for EVV Out and Sched Out.
    // - Billable follows Sched.
    const schedIn = row.schedIn || row.clockIn || "";
    const schedOut = row.schedOut || row.clockOut || "";
    const evvIn = row.clockIn || "";
    const evvOut = row.clockOut || "";

    let payableIn = evvIn;
    let payableOut = evvOut;

    if (schedIn && evvIn) {
      const diffIn = getTimeDiffMins(schedIn, evvIn);
      if (Math.abs(diffIn) <= 10) payableIn = schedIn;
    }

    if (schedOut && evvOut) {
      const diffOut = getTimeDiffMins(schedOut, evvOut);
      if (Math.abs(diffOut) <= 10) payableOut = schedOut;
    }

    return {
      payableIn: payableIn,
      payableOut: payableOut,
      billableIn: schedIn,
      billableOut: schedOut,
    };
  }

  function getTimeDiffMins(time1, time2) {
    if (!time1 || !time2) return 0;
    const [h1, m1] = time1.split(":").map(Number);
    const [h2, m2] = time2.split(":").map(Number);
    const t1 = h1 * 60 + m1;
    const t2 = h2 * 60 + m2;
    return t2 - t1;
  }

  function calculatePassedHours(inTime, outTime) {
    if (!inTime || !outTime) return 0;
    let dOut = getTimeDiffMins("00:00", outTime);
    let dIn = getTimeDiffMins("00:00", inTime);
    if (dOut < dIn) dOut += 24 * 60; // overnight

    let hours = (dOut - dIn) / 60;
    // round to 2 decimals
    return Math.round(hours * 100) / 100;
  }

  function calculateVisitHours() {
    const schedIn = document.getElementById("evSchedIn").value;
    const schedOut = document.getElementById("evSchedOut").value;

    const pIn = document.getElementById("evPayableIn").value;
    const pOut = document.getElementById("evPayableOut").value;
    const bIn = document.getElementById("evBillableIn").value;
    const bOut = document.getElementById("evBillableOut").value;

    const clockIn = document.getElementById("evClockIn").value;
    const clockOut = document.getElementById("evClockOut").value;

    // Check modification from raw EVV
    document
      .getElementById("evPayableModAlert")
      .classList.toggle("hidden", pIn === clockIn && pOut === clockOut);
    document
      .getElementById("evBillableModAlert")
      .classList.toggle("hidden", bIn === schedIn && bOut === schedOut);

    const pHrs = calculatePassedHours(pIn, pOut);
    const bHrs = calculatePassedHours(bIn, bOut);

    document.getElementById("evPayableHrs").value = pHrs.toFixed(2);
    document.getElementById("evBillableHrs").value = bHrs.toFixed(2);

    // Update main billing field (defaults to Payable Hours for caregiver, Billable is just for client logic but calculation logic uses one main 'Hours')
    // Wait, requirement: "Billable Hours follow authorized schedule and affect client payment. Payable Hours follow actual or corrected time and affect caregiver pay."
    // We handle that in calculateVisitTotals by using both.

    document.getElementById("evBillingHrs").value = pHrs.toFixed(2);

    calculateVisitTotals();
  }

  function calculateVisitTotals() {
    const billingType = document.getElementById("evBillingType").value;

    const payableHrs =
      parseFloat(document.getElementById("evPayableHrs").value) || 0;
    const billableHrs =
      parseFloat(document.getElementById("evBillableHrs").value) || 0;

    const schedIn = document.getElementById("evSchedIn").value;
    const schedOut = document.getElementById("evSchedOut").value;
    const schedHrs = calculatePassedHours(schedIn, schedOut) || 0;

    const cRate =
      parseFloat(document.getElementById("evClientRate").value) || 0;
    const cgRate =
      parseFloat(document.getElementById("evCaregiverRate").value) || 0;
    const bRate = parseFloat(document.getElementById("evBonusRate").value) || 0;

    // Bonus applies to Payable hours beyond scheduled hours
    let bonusHrs = 0;
    if (payableHrs > schedHrs) {
      bonusHrs = payableHrs - schedHrs;
    }
    document.getElementById("evExtendedHrs").value = bonusHrs.toFixed(2);

    // Agency & Softcare share per unit
    const margin = Math.max(0, cRate - cgRate);
    const agencyRate = margin * 0.8;
    const softcareRate = margin * 0.2;

    document.getElementById("evAgencyShare").value = agencyRate.toFixed(2);
    document.getElementById("evSoftcareShare").value = softcareRate.toFixed(2);

    let totClient = 0;
    let totCaregiver = 0;
    let totAgency = 0;
    let totSoftcare = 0;
    let totBonus = 0;

    if (billingType === "Hourly") {
      totClient = cRate * billableHrs;
      totCaregiver = cgRate * payableHrs;
      totAgency = agencyRate * billableHrs; // or payable? usually agency captures billable. We'll stick to billable
      totSoftcare = softcareRate * billableHrs;
      totBonus = bRate * bonusHrs;
    } else {
      totClient = cRate;
      totCaregiver = cgRate;
      totAgency = agencyRate;
      totSoftcare = softcareRate;
      totBonus = bRate; // If fixed, maybe just static bonus
    }

    document.getElementById("evTotClient").innerText =
      "$" + totClient.toFixed(2);
    document.getElementById("evTotCaregiver").innerText =
      "$" + totCaregiver.toFixed(2);
    document.getElementById("evTotAgency").innerText =
      "$" + totAgency.toFixed(2);
    document.getElementById("evTotSoftcare").innerText =
      "$" + totSoftcare.toFixed(2);
    document.getElementById("evTotBonus").innerText = "$" + totBonus.toFixed(2);
  }

  function resetEditVisitData() {
    if (window._currentEditRow) {
      populateEditShiftHistoryView(window._currentEditRow);
      Swal.fire({
        toast: true,
        position: "top-end",
        showConfirmButton: false,
        timer: 2000,
        icon: "info",
        title: "Data Reset",
      });
    }
  }

  function submitEditVisitDetails(e) {
    e.preventDefault();

    const form = e.target;
    // Check if reason is provided when hours modified
    const pIn = document.getElementById("evPayableIn").value;
    const pOut = document.getElementById("evPayableOut").value;
    const bIn = document.getElementById("evBillableIn").value;
    const bOut = document.getElementById("evBillableOut").value;
    const clockIn = document.getElementById("evClockIn").value;
    const clockOut = document.getElementById("evClockOut").value;
    const schedIn = document.getElementById("evSchedIn").value;
    const schedOut = document.getElementById("evSchedOut").value;

    const modified =
      pIn !== clockIn ||
      pOut !== clockOut ||
      bIn !== schedIn ||
      bOut !== schedOut;
    const reason = document.getElementById("evScheduleReason").value.trim();

    if (modified && !reason) {
      Swal.fire(
        "Required",
        "Schedule Reason is required when modifying payable or billable hours.",
        "warning",
      );
      document.getElementById("evScheduleReason").focus();
      return;
    }

    // Prepare payload
    const payload = {
      shiftId: document.getElementById("evShiftId").value,
      startDate: document.getElementById("evStartDate").value,
      endDate:
        document.getElementById("evEndDate").value ||
        document.getElementById("evStartDate").value,
      payableIn: pIn,
      payableOut: pOut,
      billableIn: bIn,
      billableOut: bOut,
      billingType: document.getElementById("evBillingType").value,
      serviceType: document.getElementById("evService").value,
      shiftType: document.getElementById("evType").value,
      clientRate: document.getElementById("evClientRate").value,
      caregiverRate: document.getElementById("evCaregiverRate").value,
      bonusRate: document.getElementById("evBonusRate").value,
      scheduleReason: reason,
      adminNote: document.getElementById("evAdminNote").value,

      schedIn: schedIn,
      schedOut: schedOut,

      payableHrs: document.getElementById("evPayableHrs").value,
      billableHrs: document.getElementById("evBillableHrs").value,
      bonusHrs: document.getElementById("evExtendedHrs").value,

      agencyShare: document.getElementById("evAgencyShare").value,
      softcareShare: document.getElementById("evSoftcareShare").value,
      totClient: document
        .getElementById("evTotClient")
        .innerText.replace("$", "")
        .trim(),
      totCaregiver: document
        .getElementById("evTotCaregiver")
        .innerText.replace("$", "")
        .trim(),
      totAgency: document
        .getElementById("evTotAgency")
        .innerText.replace("$", "")
        .trim(),
      totSoftcare: document
        .getElementById("evTotSoftcare")
        .innerText.replace("$", "")
        .trim(),
      totBonus: document
        .getElementById("evTotBonus")
        .innerText.replace("$", "")
        .trim(),
    };

    const btn = document.getElementById("btnSaveVisit");
    btn.disabled = true;
    btn.innerHTML =
      '<i class="ph ph-spinner animate-spin text-lg"></i> Saving...';

    // Typically you'd call a server-side function like updateVisitDetails
    if (google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerHTML =
            '<i class="ph ph-check-circle text-lg"></i> Save changes';
          if (res && res.success) {
            Swal.fire("Saved", "Visit details updated successfully", "success");
            refreshShiftHistory();
            appNavigate("shift-history");
          } else {
            Swal.fire("Error", res?.message || "Failed to update", "error");
          }
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerHTML =
            '<i class="ph ph-check-circle text-lg"></i> Save changes';
          Swal.fire("Error", err.message, "error");
        })
        .updateVisitDetails(payload);
    } else {
      // Fallback for testing locally without server
      console.log("Mock Save Payload:", payload);
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML =
          '<i class="ph ph-check-circle text-lg"></i> Save changes';
        Swal.fire(
          "Saved",
          "Visit details updated successfully (Mock)",
          "success",
        );
        appNavigate("shift-history");
      }, 1000);
    }
  }

  function toggleShiftRowHighlight(tr, event) {
    // Do not toggle if the user clicked on a button, link, input or inside an action button
    if (
      event &&
      event.target &&
      event.target.closest("button, a, input, select, textarea")
    ) {
      return;
    }
    tr.classList.toggle("highlighted-shift-row");
  }
